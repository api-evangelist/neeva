name: Neeva
description: 'Neeva was an ad-free, subscription-based consumer search engine founded in 2019 by former
  Google executives Sridhar Ramaswamy and Vivek Raghunathan, backed by Greylock and Sequoia. It positioned
  itself as a privacy-first alternative to Google, later adding an AI-powered answer engine (NeevaAI).
  Neeva was acquired by Snowflake in May 2023, and its consumer search product was shut down on June 2,
  2023, with the team and technology folding into Snowflake to power enterprise search and generative-AI
  features. The company no longer operates an independent product, developer program, or public API; this
  profile is retained as a historical portfolio-company record.'
